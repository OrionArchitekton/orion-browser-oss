name: repo-guardrails

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release preparation checks the exact source it will package
    inputs:
      source_commit:
        description: Exact package source selected by release preparation
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile hygiene
        run: python -m compileall -q src tests
      - name: No trailing whitespace
        # git grep exits 1 when nothing matches, 0 on a match, 128 on an error: only 1 passes.
        run: |
          rc=0
          git grep -n -I -E '[[:blank:]]+$' || rc=$?
          test "$rc" -eq 1

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --require-hashes --force-reinstall -r bootstrap-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build with the release's tools, pinned by hash
        # In a fresh virtual environment, every tool installed again from its hashed file (pip skips the hash
        # check for a package already installed at the pinned version), and without isolation, so that the
        # build runs only these files.
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes --force-reinstall -r bootstrap-requirements.txt
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes --force-reinstall \
            -r .github/build-requirements.txt
          "$RUNNER_TEMP/build/bin/python" -m build --no-isolation
      - name: Release archives carry the view guard, config, bootstrap, and the complete test harness
        run: |
          python - <<'PYARCHIVE'
          import glob, tarfile, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              assert 'orion_browser/websockify_path/orion_browser_view_guard.py' in wheel.namelist()
          with tarfile.open(glob.glob('dist/*.tar.gz')[0]) as source:
              names = {name.split('/', 1)[1] for name in source.getnames() if '/' in name}
              required = {'bootstrap-requirements.txt', '.github/verify_release.py', 'config.example.toml',
                          'tests/conftest.py', 'tests/fakes/fake_chrome.py', 'tests/fakes/fake_systemctl.py',
                          'tests/fakes/websockify/__init__.py'}
              assert required <= names, sorted(required - names)
          PYARCHIVE
