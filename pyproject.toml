[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-browser-oss"
version = "0.1.1"
description = "Signed-in Chrome browsers for AI agents: one per identity, leased to one agent at a time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dan Mercede" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3.0,<3", "websockets>=17.2,<18"]
keywords = ["chrome", "browser", "mcp", "model-context-protocol", "ai-agents", "devtools", "claude", "codex", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/OrionArchitekton/orion-browser-oss"
Repository = "https://github.com/OrionArchitekton/orion-browser-oss"
Documentation = "https://github.com/OrionArchitekton/orion-browser-oss/blob/main/README.md"
Issues = "https://github.com/OrionArchitekton/orion-browser-oss/issues"
Changelog = "https://github.com/OrionArchitekton/orion-browser-oss/blob/main/CHANGELOG.md"
Security = "https://github.com/OrionArchitekton/orion-browser-oss/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
orion-browser = "orion_browser.cli:entry"
orion-browser-mcp = "orion_browser.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
