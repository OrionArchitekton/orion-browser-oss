[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-browser"
version = "0.1.0"
description = "Signed-in Chrome browsers for AI agents: one per identity, leased to one agent at a time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "websockets>=17.2,<18"]

[project.urls]
Repository = "https://github.com/OrionArchitekton/orion-browser-oss"
Documentation = "https://github.com/OrionArchitekton/orion-browser-oss/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orion-browser = "orion_browser.cli:entry"
orion-browser-mcp = "orion_browser.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
